<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPent Leaderboard has moved</title>
</head>
<body>
  <h1>RPent Leaderboard has moved / 排行榜已迁移</h1>
  <p><a href="https://rpent.readthedocs.io/en/latest/rst_source/leaderboard/index.html">English leaderboard</a></p>
  <p><a href="https://rpent.readthedocs.io/zh-cn/latest/rst_source/leaderboard/index.html">中文排行榜</a></p>
  <script>
    const params = new URLSearchParams(location.search);
    const language = params.get('lang') === 'en' ? 'en' : 'zh-cn';
    const target = new URL(`https://rpent.readthedocs.io/${language}/latest/rst_source/leaderboard/index.html`);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</body>
</html>
